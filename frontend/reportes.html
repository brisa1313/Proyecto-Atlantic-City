<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes Analíticos - Atlantic City</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>ATLANTIC CITY</h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="buscar.html">Clientes</a>
            <a href="campanas.html">Campañas</a>
            <a href="reportes.html" class="active">Reportes</a>
            <a href="#" onclick="cerrarSesion()" style="color: #ff4d4d; margin-left: 30px; font-weight: bold;">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="main-content">
        <h2>Reportes del Programa de Fidelización</h2>
        <p>Distribución de Clientes Únicos por Nivel de Membresía corporativa:</p>
        
        <!-- Botón exclusivo para Marketing y Admin para exportar CSV -->
        <button class="btn-primary" id="btnExportar" style="background-color: #28a745;" onclick="exportarClientesCSV()">📥 Exportar Datos de Clientes (CSV)</button>
        
        <table>
            <thead>
                <tr>
                    <th>Nivel de Membresía</th>
                    <th>Cantidad de Clientes Afiliados</th>
                </tr>
            </thead>
            <tbody id="tablaReporte"></tbody>
        </table>
    </div>

    <script>
        const rol = localStorage.getItem('rolUsuario');

        async function cargarReporte() {
            // Protección extrema: El operario no puede bajo ningún concepto ver esta página
            if (!rol || rol === 'operario') { 
                window.location.href = 'dashboard.html'; 
                return; 
            }

            const res = await fetch('http://localhost:3000/api/reportes/dashboard');
            const datos = await res.json();
            const tbody = document.getElementById('tablaReporte');
            tbody.innerHTML = '';

            datos.forEach(item => {
                tbody.innerHTML += `<tr><td><strong>${item.categoria}</strong></td><td>${item.cantidad} clientes</td></tr>`;
            });
        }

        // Función solicitada por Marketing para descargar la base de clientes completa en un CSV nativo
        async function exportarClientesCSV() {
            const res = await fetch('http://localhost:3000/api/clientes');
            const clientes = await res.json();
            
            let csvContent = "data:text/csv;charset=utf-8,ID,TipoDoc,Documento,Nombres,Apellidos,Correo,Telefono,Categoria,Puntos\n";
            
            clientes.forEach(c => {
                csvContent += `${c.id},${c.tipo_documento},${c.numero_documento},${c.nombres},${c.apellidos},${c.correo_electronico || ''},${c.telefono || ''},${c.categoria_inicial},${c.puntos_acumulados}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Reporte_Clientes_AtlanticCity.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function cerrarSesion() { localStorage.clear(); window.location.href = 'index.html'; }
        cargarReporte();
    </script>
</body>
</html>
